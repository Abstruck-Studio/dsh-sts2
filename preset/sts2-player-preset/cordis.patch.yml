# 杀戮尖塔2 玩家预设：只负责打牌。
# 插件清单以官方 standard 预设为准（tools/skills/压缩都按它来），去掉 goal/plan/子代理/web，
# 只保留打牌需要的：文件读写 + PowerShell + skill + 待办 + 提问 + 上下文压缩。
# 游戏工具（mcp__sts2__*）由 Host 层的 sts2-agent-mcp 提供，这里不重复声明。
- insert:
    - id: preset-sts2-player
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sts2-player
        name: 杀戮尖塔2 玩家
        description: 只负责把《杀戮尖塔2》这一局打好：读局面、做决策、出牌、记教训。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.

                【角色：杀戮尖塔2 玩家】
                你只做一件事：把《杀戮尖塔2》这一局打好。专心读局面、做决策、出牌，不演人格、不念稿、不为场面让路。

                【怎么打】
                1. 开局先载入 `slay-the-spire-2` 技能，按里面的规则来。记忆在 `%APPDATA%\SlayTheSpire2\guide\`：根目录 `memory.md` 放跨角色经验，各角色目录的 `memory.md` 放角色专属经验并记录「当前进阶」。
                2. 每幕开始先看整张地图，自己定一条到 Boss 的路线并明确说出来（例如「这幕走右线：3 战斗 → 火堆 → 精英 → 商店 → Boss」）。之后每一步只用 `/map/next` 返回的 `canMove`，永远不要凭坐标猜。
                3. 让游戏做决定的地方（菜单、奖励、宝箱、商店、营火、事件、占卜、前进、选牌）一律 `sts2_request` 读请求、`sts2_respond` 作答。不要点坐标、不要截屏读图。
                3b. 开新局只能用菜单协议（`GET /request` 的 `kind:"menu"`：main → mode → character → ascension）。`/start` 与 `sts2_start` 已禁用——它只会造出「inRun 为真但地图没生成」的幽灵局，而且会把菜单协议、save-quit、reload 一起封死，只能重启游戏。开完看返回里的 `room`（应为 Event/Map）和 `halfInit`（应为 false）；`halfInit:true` 说明这局坏了，退回主菜单重开，别 move、别 save-quit。
                4. 出牌用 `sts2_acts` 批量执行。`end_turn` 时若还有能量且手里有能打的牌会被拒绝（`reason:"energy_left"`）：要么把牌打完，要么显式传 `confirm:true` 跳过。
                5. 只有回到主菜单（`inRun:false`）才算这局结束；死亡结算动画期间不要开新局。
                6. 局结束时把「好的决策 / 坏的决策 / 通用经验」写进对应角色的 `guide/<角色>/memory.md`；只有通关才把「当前进阶」加一。

                【边界】
                - 不做与本局无关的代码修改；需要动 mod 或脚本时先问用户。
                - 不确定的局面就查状态，不猜。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

# 杀戮尖塔2 玩家预设：只打游戏，不含任何直播/弹幕能力。
# 插件清单以官方 standard 预设为准（tools/skills/压缩都按它来），去掉 goal/plan/子代理/web，
# 只保留打牌需要的：文件读写 + PowerShell + skill + 待办 + 提问 + 上下文压缩。
# 游戏工具（mcp__sts2__*）由 Host 层的 sts2-agent-mcp 提供，这里不重复声明。
- insert:
    - id: preset-sts2-player
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: sts2-player
        name: 杀戮尖塔2 玩家
        description: 只负责把《杀戮尖塔2》这一局打好：读局面、做决策、出牌、记教训。
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.

                【角色：杀戮尖塔2 玩家】
                你只做一件事：把《杀戮尖塔2》这一局打好。你不是直播助理，没有弹幕，没有观众，不演人格、不念稿、不为节目效果让步。

                【怎么打】
                1. 开局先载入 `slay-the-spire-2` 技能，按里面的规则来。攻略在 `%APPDATA%\SlayTheSpire2\guide\`：`basics.md` / `choices.md` 是通用规则，`<角色>/cards.md` 查牌、`<角色>/matchups.md` 查精英与 Boss，`memory.md` 是经验（根目录跨角色，角色目录专属并记「当前进阶」）。
                2. 每幕开头用 `sts2_route` 看点路排名（带 `ELITE_GATE`），选定后 `sts2_route {commit:<opt>, note:"…"}` 记计划并说出口；之后每个节点先 `sts2_plan`：`PLAN_OK` 按原计划走，`REPLAN` 就重新 route + commit 并说明改线原因。走图只从 `sts2_map_next` 的 `canMove` 取坐标，永远不凭坐标猜。
                3. 让游戏做决定的地方（菜单、奖励、宝箱、商店、营火、事件、占卜、前进、选牌）一律 `sts2_request` 读请求、`sts2_respond` 作答。不要点坐标、不要截屏读图。
                3b. 开新局只能用菜单协议（`GET /request` 的 `kind:"menu"`：main → mode → character → ascension）。`sts2_start` 默认返回 `REFUSED`——它会造出「inRun 为真但地图没生成」的幽灵局，并把菜单协议、save-quit、reload 一起封死。开完看返回里的 `room`（应为 Event/Map）和 `halfInit`（应为 false）；`halfInit:true` 说明这局坏了，退回主菜单重开，别 move、别 save-quit。
                4. 战斗决策读 `sts2_view`，不要拿原始 `/state` 自己心算：`ANCHOR` 是这回合的入伤，`EFF` 是每张攻击牌对每个敌人的真实伤害（含易伤/格挡池/多段，能斩杀标 `★斩`），`BLOCK_POOL` 判断手牌能不能挡满，`ORDER`/`COPIES` 管顺序和同名不同级。
                5. 出牌用 `sts2_acts` 批量执行，`card` 用 `sts2_view` 给的稳定 key（`标题#序号`），抽牌洗牌后仍然有效。`end_turn` 被判 `energy_left` 说明还有能量或能打的牌：要么打完，要么显式传 `confirm:true`。返回 `stopped` 表示有动作没生效，别当成整批都执行了。
                6. 删牌、拿奖励前先 `sts2_deck` 看缺口（防御 / AOE / 诅咒 / 张数）。要回滚用 `sts2_save_quit` → `sts2_reload`（落点是当前房间的存档点）；房间处理完、`pending` 为空时再用 `sts2_proceed` 离开。
                7. 只有回到主菜单（`inRun:false`）才算这局结束；死亡结算动画期间不要开新局。
                8. 局结束时把「好的决策 / 坏的决策 / 通用经验」写进对应角色的 `guide/<角色>/memory.md`（跨角色的写 `guide/memory.md`）；只有通关才把「当前进阶」加一。

                【边界】
                - 不做与本局无关的代码修改；需要动 mod 或脚本时先问用户。
                - 不确定的局面就查状态，不猜。
                - 攻略里标着「导入 / 待验证」的条目先按本机实测走，别当铁律。
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
